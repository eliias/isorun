[package]
name = "isorun"
version = "0.1.13"
edition = "2021"
authors = ["Hannes Moser <box@hannesmoser.at>"]
homepage = "https://github.com/eliias/isorun"
repository = "https://github.com/eliias/isorun"

[dependencies]
deno_core = "0.204.0"
deno_fs = "0.28.0"
deno_runtime = "0.126.0"
deno_web = "0.149.0"
magnus = { git = "https://github.com/eliias/magnus", rev = "c884e431b1b12719d1f8d8ab587870c4d88cde34" }
tokio = { version = "1.53.3", features = ["full"] }
v8 = "0.87.0"

# deno_ffi pins libffi-sys 2.3.0. Its bundled libffi does not build with the
# current Apple clang, so link the libffi from the macOS SDK instead.
# deno_runtime also uses deno_ffi in its build script, hence both sections.
[target.'cfg(target_os = "macos")'.dependencies]
libffi-sys = { version = "2.3.0", features = ["system"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
libffi-sys = { version = "2.3.0", features = ["system"] }

[dev-dependencies]
magnus = { git = "https://github.com/eliias/magnus", rev = "c884e431b1b12719d1f8d8ab587870c4d88cde34", features = ["embed"] }
protoc = "2.28.0"

[lib]
name = "isorun"
crate-type = ["cdylib"]
